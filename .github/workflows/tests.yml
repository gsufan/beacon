name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        # Failing tests are also published as annotations, visible in the run summary
        # without opening the full log.
        run: |
          set -o pipefail
          pytest tests/ -v -rfE 2>&1 | tee pytest.log || {
            grep -E '^(FAILED|ERROR) ' pytest.log | sed 's/^/::error title=pytest::/'
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  # macOS (Apple Silicon): tests, interface and the real installer, with no GPU and no models.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pytest tests/ -q -rfE

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Installer and launcher
        # No Ollama here: the installer must finish and say so; the launcher must start the CLI.
        run: |
          python tools/install.py
          ./beacon --help
          ./beacon doctor || true
