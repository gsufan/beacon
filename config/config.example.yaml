ai_provider:
  provider: ollama
  ollama_host: http://localhost:11434
  embedding_model: qwen3-embedding:0.6b
  llm_model: llama3:8b
  # Ventana de contexto que se pide al modelo (opcional, 8192 por defecto). Con un modelo
  # de más contexto y más memoria de video se puede subir, por ejemplo a 16384 o 32768.
  # llm_num_ctx: 8192

# Repos a analizar. Lo más simple es registrarlos con la CLI o la UI, que
# editan esta lista por ti:
#   beacon add mi-proyecto --repo-path ../mi-proyecto
#   beacon add mi-proyecto --url https://github.com/usuario/repo.git
# repo_path es relativo a la raíz de este proyecto (o una ruta absoluta).
projects: []
