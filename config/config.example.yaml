ai_provider:
  provider: ollama
  ollama_host: http://localhost:11434
  embedding_model: qwen3-embedding:0.6b
  llm_model: llama3:8b
  # Context window requested from the model (optional, 8192 by default). With a model that supports
  # more context and enough video memory it can be raised, for example to 16384 or 32768.
  # llm_num_ctx: 8192

# Repositories to analyze. The simplest way is to register them with the CLI or the UI, which edit
# this list for you:
#   beacon add my-project --repo-path ../my-project
#   beacon add my-project --url https://github.com/user/repo.git
# repo_path is relative to the project root (or an absolute path).
projects: []
