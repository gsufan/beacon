# Tokens de acceso para repos privados clonados por URL.
# Copia este archivo a config/credentials.yaml (gitignoreado — nunca
# subas el real a control de versiones) y completa los tokens que necesites.
#
# Se genera automáticamente si registrás un proyecto con token desde la UI
# (Configuración > Registrar nuevo proyecto > Clonar desde URL); editarlo
# a mano solo hace falta si querés precargar uno.

projects:
  mi-proyecto-privado: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
