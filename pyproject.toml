[project]
name = "beacon"
version = "0.3.0"
description = "Plataforma local (RAG) para detectar y mitigar deuda técnica en repositorios de código"
readme = "README.md"
license = { file = "LICENSE" }
# <3.13: tree-sitter-languages 1.10.2 (requirements.txt) publishes no wheels for Python 3.13+, so
# installation would fail. Docker and CI use 3.11.
requires-python = ">=3.10,<3.13"

[project.scripts]
beacon = "core.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"
