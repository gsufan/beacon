[project]
name = "beacon"
version = "0.3.0"
description = "Centro de apoyo al desarrollador: RAG sobre modelos locales para comprender y documentar el código, con modo equipo (Beacon Hub)"
readme = "README.md"
license = { file = "LICENSE" }
# <3.13: tree-sitter-languages 1.10.2 (requirements.txt) publishes no wheels for Python 3.13+, so
# installation would fail. Docker and CI use 3.11.
requires-python = ">=3.10,<3.13"

[project.scripts]
beacon = "core.cli:app"
beacon-hub = "hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"
