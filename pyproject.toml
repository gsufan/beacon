[project]
name = "beacon"
version = "0.3.0"
description = "Plataforma local (RAG) para detectar y mitigar deuda técnica en repositorios de código"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
beacon = "core.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
