<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de que React monte,
      // para no mostrar un flash del tema equivocado al cargar.
      (function () {
        var stored = localStorage.getItem("beacon:theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bg-beacon-12 text-beacon-2 dark:bg-beacon-1 dark:text-beacon-12">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
