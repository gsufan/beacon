services:
  ollama:
    image: ollama/ollama:0.32.14
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # CPU by default (slower). To use an NVIDIA GPU, uncomment the block below
    # (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  beacon:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      # Optional: protects the API with the X-API-Key header (see docs/en/security.md). If enabled, enter the
      # same key in Settings > Security in the interface.
      - BEACON_API_KEY=${BEACON_API_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
